[package]
name = "sairgent_kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
sha2 = "0.10"
hkdf = "0.12"
axum = "0.8.8"
base64 = "0.22.1"
dirs = "5.0.1"
libc = "0.2"
rand = "0.10.0"
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.21.0", features = ["v4"] }
